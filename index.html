<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mailroom-dev · knowledge graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://unpkg.com/vis-network@9.1.6/standalone/css/vis-network.min.css">
<script src="https://unpkg.com/vis-network@9.1.6/standalone/umd/vis-network.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter','Segoe UI',system-ui,sans-serif; background:#0a0a0f; color:#c8d0dc; overflow:hidden; }
  header { display:flex; justify-content:space-between; align-items:center; padding:10px 16px; background:#0e0e14; border-bottom:1px solid #1f2533; position:relative; z-index:10; }
  .brand { font-weight:700; font-size:14px; color:#e4ecfa; white-space:nowrap; }
  .brand small { font-weight:400; opacity:.5; margin-left:6px; font-size:11px; }
  #stats { max-width:620px; width:100%; text-align:right; font-size:11px; line-height:1.55; color:#6b7a8f; overflow:hidden; }
  #stats a { color:#4a7fc9; text-decoration:none; }
  #searchbox-wrap { position:absolute; top:52px; left:16px; z-index:20; }
  #searchbox { width:240px; padding:8px 10px; background:#131320; border:1px solid #2a2f40; border-radius:8px; color:#c8d0dc; font-size:13px; outline:none; transition:border-color .2s; }
  #searchbox:focus { border-color:#34d399; }
  #legend { position:absolute; bottom:16px; left:16px; background:#0e0e14ee; border:1px solid #1f2533; border-radius:10px; padding:14px 18px; min-width:220px; font-size:12px; z-index:15; }
  #legend h3 { font-size:13px; font-weight:600; color:#e4ecfa; margin-bottom:10px; letter-spacing:.4px; }
  .layer-item { display:flex; align-items:center; gap:8px; padding:4px 0; cursor:pointer; }
  .layer-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .layer-label { color:#b0bcc8; flex:1; }
  .layer-count { color:#555; font-size:11px; }
  .tooltip { position:absolute; background:#16162a; border:1px solid #2a2f40; border-radius:6px; padding:10px 14px; font-size:12px; pointer-events:none; z-index:20; max-width:280px; color:#c8d0dc; box-shadow:0 4px 12px rgba(0,0,0,.4); display:none; }
  .tooltip .tt-title { font-weight:600; color:#e4ecfa; margin-bottom:4px; }
  .tooltip .tt-meta { color:#6b7a8f; font-size:11px; }
  footer { position:fixed; bottom:0; left:0; right:0; text-align:center; padding:6px; background:#0a0a0fcc; color:#3a4255; font-size:10px; z-index:10; }
  @media(max-width:800px){ header{padding:8px 12px} #searchbox-wrap{top:48px;left:12px} #legend{bottom:8px;left:8px;padding:10px 14px} #stats{text-align:left;margin-top:0;width:auto;max-width:none} .brand{font-size:13px} }
</style>
</head>
<body>
<header>
  <div class="brand">mailroom-dev<small id="version"></small></div>
  <div id="stats"></div>
</header>
<div id="searchbox-wrap"><input type="text" id="searchbox" placeholder="/ search..."></div>
<div id="legend"><h3>Layers</h3><div id="layers-list"></div></div>
<div id="graph"></div>
<div class="tooltip" id="tooltip"><div class="tt-title"></div><div class="tt-meta"></div></div>
<footer>scroll to zoom · drag nodes &middot; click layers to filter</footer>

<script src="./data.js"></script>
<script>
(function(){
  // Assemble DATA object from separate variables
  var DATA = { nodes: graphNodes, edges: graphEdges };
  var LAYERS = graphLayers;
  var PIPELINE = graphPipeline;
  var GODS = graphGods;
  var RELS = graphRels;

  document.getElementById('version').innerHTML = '· %s · %s'.replace('%s','COMMIT_SHA_PLACEHOLDER').replace('%s','TODAY_PLACEHOLDER');

  // Compute degrees
  var deg={};
  DATA.edges.forEach(e=>{deg[e.f]=(deg[e.f]||0)+1;deg[e.t]=(deg[e.t]||0)+1});
  
  // Build visible node map
  var hiddenLayers={};
  function getVisibleNodes(){
    var ns=DATA.nodes.filter(n=>!hiddenLayers[n.ly]);
    var count={};ns.forEach(n=>{count[n.ly]=(count[n.ly]||0)+1});
    return {nodes:ns,counts:count};
  }

  // Network options
  var options={
    layout:{randomSeed:42,hierarchical:{enabled:false}},
    physics:{barnesHut:{gravitationalConstant:-2800,centralGravity:0.3,springLength:120,springConstant:0.008,damping:0.09},minVelocity:0.75},
    interaction:{hover:true,tooltipDelay:200,zoomView:true,navigationButtons:true,kinetic:{maxVelocity:150,minimumBounceLimit:60,smoothDelay:100,smoothDirection:1,timelineThreshold:50},hideEdgesOnZoom:false,hideNodesOnZoom:false,maxPhysicalIterations:2000,dragNodes:true,dragView:true,clickToUse:true},
    nodes:{shape:'dot',size:4,font:{size:10,color:'#b0bcc8'},borderWidth:0,shadow:false},
    edges:{width:0.4,color:{inherit:'direction',opacity:0.15},smooth:{type:'continuous',roundness:0.1},arrows:{to:{enabled:false}},selectionWidth:0},
  };

  // Create dataset views
  var edgesDS=new vis.DataSet(DATA.edges.map(e=>({id:e.f+'_'+e.t,from:e.f,to:e.t,label:e.r!==undefined&&e.r?'':'',group:e.r||'default',physics:true})));
  var {nodes:allNodes}=getVisibleNodes();
  var nodesDS=new vis.DataSet(allNodes.map(n=>({...n, PhysicsOptions:true, borderWidth:0, size:Math.max(3,Math.min(12,Math.sqrt(deg[n.id]||0))))})));

  // Network container
  var container=document.getElementById('graph');
  var network=new vis.Network(container,{nodes:nodesDS,edges:edgesDS},options);

  // Tooltip
  var tooltip=document.getElementById('tooltip');
  network.on('hoverNode',function(p){
    var n=nodesDS.get(p.node);if(!n)return;
    tooltip.querySelector('.tt-title').textContent=n.l||n.id;
    tooltip.querySelector('.tt-meta').textContent='deg: '+(deg[n.id]||0)+'\nid: '+n.id+'\nfile: '+n.sf;
    tooltip.style.display='block';
  });
  network.on('moveNode',function(){});
  network.on('blurNode',function(){tooltip.style.display='none'});
  network.on('hoverEdge',function(){});
  network.on('blurEdge',function(){});

  // Hover styling
  network.setOptions({nodes:{color:{backgroundColor:'#34d399',border:'#fff'},hover:{backgroundColor:'#4ade80',border:'#fff'}}});

  // Stats
  var statsEl=document.getElementById('stats');
  statsEl.innerHTML=allNodes.length+' production symbols · '+DATA.edges.length+' edges · '+Object.keys(hiddenLayers).length+' hidden layers<br>';
  statsEl.innerHTML+='%d nodes · %d files · tests/notebooks/.opencode excluded<br>'.replace('%d',allNodes.length).replace('%d',new Set(allNodes.map(n=>n.sf)).size);
  statsEl.innerHTML+='<kbd>/</kbd> search · <kbd>Esc</kbd> clear';

  // Legend
  var legendEl=document.getElementById('layers-list');
  var allHidden=Object.keys(hiddenLayers).length===0;
  LAYERS.forEach(function(L){
    var c=allHidden?LAYERS.length:LAYERS.filter(l=>!hiddenLayers[l.id]).length;
    var item=document.createElement('div');item.className='layer-item';
    item.innerHTML='<span class="layer-dot" style="background:'+L.color+'"></span><span class="layer-label">'+L.title+'</span><span class="layer-count">'+c+'</span>';
    item.addEventListener('click',function(){
      if(!hiddenLayers[L.id]){hiddenLayers[L.id]=true}else{delete hiddenLayers[L.id]}
      rebuild();updateLegend();updateStats();
    });
    legendEl.appendChild(item);
  });

  function rebuild(){
    var {nodes,counts}=getVisibleNodes();
    nodesDS.clear();edgesDS.clear();
    nodes.forEach(function(n){nodesDS.add({...n,PhysicsOptions:true,borderWidth:0,size:Math.max(3,Math.min(12,Math.sqrt(deg[n.id]||0)))})});
    DATA.edges.forEach(function(e){if(nodes.find(n=>n.id===e.f)&&nodes.find(n=>n.id===e.t))edgesDS.add({id:e.f+'_'+e.t,from:e.f,to:e.t,label:e.r!==undefined&&e.r?'':'',group:e.r||'default',physics:true})});
  }

  function updateLegend(){LAYERS.forEach(function(L){var c=LAYERS.filter(l=>!hiddenLayers[l.id]).length;var dots=legendEl.querySelectorAll('.layer-dot');dots.forEach(function(d,i){})});}
  function updateStats(){statsEl.innerHTML=getVisibleNodes().nodes.length+' production symbols · '+DATA.edges.length+' edges · '+Object.keys(hiddenLayers).length+' hidden layers<br>'+document.getElementById('stats').querySelectorAll('br')[0].parentNode.innerHTML;}

  // Search
  var searchBox=document.getElementById('searchbox');
  searchBox.addEventListener('input',function(){
    var q=searchBox.value.toLowerCase().trim();
    if(!q){network.selectNodes([]);network.setOptions({nodes:{fontSize:10,color:'#b0bcc8'}});return}
    var matches=nodesDS.get().filter(n=>(n.l||'').toLowerCase().includes(q)||(n.id||'').toLowerCase().includes(q)||(n.sf||'').toLowerCase().includes(q));
    var ids=matches.map(n=>n.id);
    network.selectNodes(ids);
    var neighbors=new Set(ids);
    DATA.edges.forEach(function(e){if(ids.includes(e.f))neighbors.add(e.t);if(ids.includes(e.t))neighbors.add(e.f)});
    var keepIds=new Array(neighbors.size);var idx=0;neighbors.forEach(function(id){keepIds[idx++]=id});
    var allNodesList=nodesDS.get();
    var allIds=allNodesList.map(function(n){return n.id});
    allIds.forEach(function(id){
      var n=allNodesList.find(x=>x.id===id);
      if(n){n.color=neighbors.has(id)?{backgroundColor:'#34d399',border:'#fff'}:{color:{fill:'#1a1a2e',stroke:'#1a1a2e'},borderColor:'#1a1a2e'}};
    });
    nodesDS.update(allNodesList);
  });

  // Keyboard shortcut
  window.addEventListener('keydown',function(e){if(e.key==='/'){e.preventDefault();searchBox.focus()}if(e.key==='Escape'){searchBox.value='';searchBox.dispatchEvent(new Event('input'));searchBox.blur()}});

  // Fit view
  setTimeout(function(){network.fit({animation:{duration:600,easingFunction:'easeInOutQuad'}})},300);

})();
</script>
</body>
</html>
